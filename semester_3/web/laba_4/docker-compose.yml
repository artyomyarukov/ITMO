services:
  db:
    image: postgres:17-alpine
    container_name: lab4-db-container
    environment:
      POSTGRES_DB: laba_4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: lab4-backend-container
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/laba_4
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - db


  frontend:
    build: ./frontend
    container_name: lab4-frontend-container
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pg_data: